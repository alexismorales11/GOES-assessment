name: prueba-upc

services:
  db:
    image: postgres:16-alpine
    container_name: prueba-upc-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-productos_upc}
      POSTGRES_USER: ${POSTGRES_USER:-prueba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prueba123}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data:/data:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Opcional: cliente web para inspeccionar la base de datos.
  # Se levanta con: docker compose --profile tools up -d
  adminer:
    image: adminer:4.8.1
    container_name: prueba-upc-adminer
    profiles: ["tools"]
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
